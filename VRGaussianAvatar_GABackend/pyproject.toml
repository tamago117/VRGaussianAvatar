[project]
name = "vrga-backend"
version = "0.1.0"
description = "VRGaussianAvatar GA Backend - LHM inference + WebSocket streaming server"
readme = "README.md"
# LHM is only validated on Python 3.10 (INSTALL.md). Several pinned deps have no
# wheels for 3.11+, so the range is hard-locked here.
requires-python = ">=3.10,<3.11"

dependencies = [
    # --- streaming server (main_server_*.py) ---
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "websockets",

    # --- torch stack (CUDA 12.1 build, see [tool.uv.sources]) ---
    "torch==2.3.0",
    "torchvision==0.18.0",
    "xformers==0.0.26.post1",

    # --- CUDA extensions, installed as prebuilt wheels ---
    "pytorch3d==0.7.8+pt2.3.0cu121",
    "gsplat==1.4.0+pt23cu121",

    # --- CUDA extensions, built from source (see [tool.uv] below) ---
    "diff-gaussian-rasterization",

    # --- git-sourced deps (see [tool.uv.sources]) ---
    "chumpy",
    "basicsr",
    "sam-2",

    # --- LHM dependencies (from LHM/requirements.txt) ---
    "accelerate",
    "decord==0.6.0",
    "diffusers==0.32.0",
    "einops",
    "gfpgan==1.3.8",
    "gradio==4.43.0",
    "huggingface-hub==0.23.2",
    "imageio==2.34.1",
    "imageio-ffmpeg",
    "jaxtyping==0.2.38",
    "kiui==0.2.14",
    "kornia==0.7.2",
    "loguru==0.7.3",
    # LHM pip-installs these at import time if they are missing
    # (LHM/utils/{model_download_utils,gpu_utils,video_utils}.py).
    # Declaring them keeps the env reproducible and stops `uv sync`
    # from pruning what those runtime installs dropped in.
    "modelscope",
    "gputil",
    "imagehash",
    "lpips==0.1.4",
    "matplotlib==3.5.3",
    # LHM pins 4.1.0.post2, which imports fcntl and therefore cannot be
    # imported on Windows at all. 5.x dropped that import.
    "megfile>=5.0",
    "numpy==1.23.4",
    "omegaconf==2.3.0",
    "open3d==0.19.0",
    "opencv-python",
    "opencv-python-headless",
    "pillow==10.4.0",
    # chumpy's setup.py imports pip._internal at build time, and it is built
    # without isolation - so pip has to exist in the venv itself.
    "pip",
    "plyfile",
    "pygltflib==1.16.2",
    "pyrender==0.1.45",
    "pyyaml==6.0.1",
    "rembg==2.0.63",
    # rembg keeps its ONNX runtime behind an extra, but LHM imports rembg
    # unconditionally as the SAM2 fallback.
    "onnxruntime",
    "requests==2.32.3",
    "roma",
    "scipy",
    "setuptools==74.0.0",
    "smplx",
    "taming-transformers-rom1504==0.0.6",
    "timm==1.0.15",
    "tqdm==4.66.4",
    "transformers==4.41.2",
    "trimesh==4.4.9",
    "typeguard==2.13.3",
    "wheel",
    "xatlas==0.0.9",
]

# Nothing here is a distributable package - LHM/ is a submodule on sys.path.
[tool.uv]
package = false

# These build against the *installed* torch, so they must not be built in an
# isolated env (pip would pull a CPU torch in there). Install order is handled
# by the two-pass `uv sync` in setup.bat.
no-build-isolation-package = [
    "chumpy",
    "basicsr",
    "sam-2",
    "diff-gaussian-rasterization",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Prebuilt CUDA-extension wheels (pytorch3d) - avoids needing the CUDA Toolkit.
[[tool.uv.index]]
name = "torch-packages-builder"
url = "https://miropsota.github.io/torch_packages_builder"
explicit = true

[[tool.uv.index]]
name = "gsplat"
url = "https://docs.gsplat.studio/whl/pt23cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
xformers = { index = "pytorch-cu121" }
pytorch3d = { index = "torch-packages-builder" }
gsplat = { index = "gsplat" }

# LHM needs ashawkey's fork: it returns (color, radii, depth, alpha).
# The upstream graphdeco rasterizer returns 3 values and is NOT compatible.
diff-gaussian-rasterization = { git = "https://github.com/ashawkey/diff-gaussian-rasterization", rev = "8829d14f814fccdaf840b7b0f3021a616583c0a1" }
# Not on PyPI in a usable form. This rev works with the pinned numpy 1.23.4
# (later numpy removes the np.bool / np.float aliases chumpy relies on).
chumpy = { git = "https://github.com/mattloper/chumpy", rev = "9b045ff5d6588a24a0bab52c83f032e2ba433e17" }
# Installed from source to avoid the torchvision import conflict in basicsr 1.4.2.
basicsr = { git = "https://github.com/XPixelGroup/BasicSR", rev = "8d56e3a045f9fb3e1d8872f92ee4a4f07f886b0a" }
# LHM uses this modified SAM2.
sam-2 = { git = "https://github.com/hitsz-zuoqi/sam2", rev = "8d52c01a6a7a1efe5a01c193fb5a13366654cdaf" }

# Declared up front so `uv lock` never has to build these source dists just to
# read their metadata (they import torch at build time, which is unavailable in
# an isolated build env). Values mirror each project's setup.py / requirements.
[[tool.uv.dependency-metadata]]
name = "diff-gaussian-rasterization"
version = "0.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "chumpy"
# The tree at this rev builds as 0.72; a mismatch here makes uv reinstall
# chumpy on every sync.
version = "0.72"
requires-dist = ["numpy>=1.8.1", "scipy>=0.13.0", "six>=1.11.0"]

[[tool.uv.dependency-metadata]]
name = "basicsr"
version = "1.4.2"
requires-dist = [
    "addict",
    "future",
    "lmdb",
    "numpy>=1.17",
    "opencv-python",
    "pillow",
    "pyyaml",
    "requests",
    "scikit-image",
    "scipy",
    "tb-nightly",
    "torch>=1.7",
    "torchvision",
    "tqdm",
    "yapf",
]

[[tool.uv.dependency-metadata]]
name = "sam-2"
version = "1.0"
requires-dist = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.23.0",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
]
